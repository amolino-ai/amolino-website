# Sample company for product widgets on amolino.ai: help articles, marketing pages and the blog.
# Everything here is fictional. Domains use the reserved .example TLD.
#
# The company, team, products and buyers follow the Amolino app's demo world "Meridian"
# (demo/worlds/meridian/bible.yaml in the app repo), so the website and app demos tell the same story.
#
# Field names and values follow the Amolino API (see src/lib/demo-data/app-types.generated.ts,
# synced from the app with `npm run sync:app-types`). The file is validated at build time;
# a mismatch fails the build.
#
# Nothing in here is a total. Forecast numbers (the chart, best/worst case, "last 7 days") are
# calculated from the opportunities and their forecast_history. The current values reproduce the
# help screenshots: Closed won $1.3M, Confident $2.5M, Upside $29.5K, Accelerator $271.2K,
# Forecast $3.9M (from $5.5M 7 days ago), target $10M.

company:
  name: Meridian Supply Co.
  description: Distributor of field supplies, sampling consumables and site safety equipment for mining and exploration
  domain: meridiansupply.example
  currency: USD

