            from: 0.79
            to: 0.84
    meddpicc:
      fields:
        metrics:
          state: confirmed
          details:
            - Cut equipment search time at each site by 30%
            - Reduce damaged sample crates by 40% a year
          long_details: Kestrel measured an average of 25 minutes lost per shift looking for equipment across their three original sites. Rachel shared a target of a 30% reduction, and a 40% drop in damaged sample crates, which costs them about $180K a year.
        economic_buyer:
          state: confirmed
