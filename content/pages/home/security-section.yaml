heading: "Security and Privacy"
description: "Amolino is built on enterprise-grade security. We're CASA 2 certified and trusted by organizations that demand the highest standards for data protection and privacy."

features:
  - title: "CASA Tier 2 Certified"
    description: "Independently verified by Google to meet Cloud Application Security Assessment standards for enterprise applications"
    
  - title: "Encryption in Transit & at Rest"
    description: "All data is encrypted using TLS 1.3 in transit and AES-256 at rest—industry-standard protection"
    
  - title: "GDPR & CCPA Compliant"
    description: "Built to comply with global data privacy regulations including European GDPR and California CCPA"
    
  - title: "Microsoft Cloud Partner"
    description: "Verified Microsoft partner with approved cloud infrastructure and security standards"
    
  - title: "Role-Based Access Control"
    description: "Granular permissions ensure data is only accessible to authorized team members"
    
  - title: "Regular Security Audits"
    description: "Continuous monitoring and third-party security assessments to maintain the highest protection standards"