hero:
  title: "Defend Every Forecast with Confidence"
  subtitle: "AI-Powered Revenue Forecasting"
  description: "Stop defending forecasts based on gut feelings and spreadsheet guesswork. AmolinoAI analyzes every signal—engagement patterns, stakeholder activity, timeline changes, and competitive threats—to generate accurate revenue predictions you can actually explain. No more black-box forecasts. Just transparent, data-driven projections backed by the insights that matter."
  ctaText: "Try AmolinoAI"
  ctaLink: "https://app.amolino.ai"
  backgroundGradient: "from-blue-600 to-cyan-600"

problems:
  title: "Forecast with Transparency, Not Hope"
  subtitle: "Transform unreliable forecasts into defendable predictions with explainable AI"
  cards:
    - icon: "🎯"
      title: "AI-Powered Precision"
      description: "Get quarterly forecasts that show exactly why each deal is likely to close—or slip. Every prediction comes with the signals that drive it. Predictions you can trust and explain."
    - icon: "⚡"
      title: "Signal-Based Intelligence"
      description: "Track engagement drops, timeline shifts, and stakeholder changes that impact your forecast—before they surprise you in the QBR. Real-time visibility into what's changing."
    - icon: "🔀"
      title: "Scenario Planning"
      description: "See your ceiling, floor, and most probable revenue scenarios so you can make informed decisions and set realistic expectations. Plan for best, worst, and likely outcomes."

stats:
  title: "Forecasts Sales Leaders Can Actually Defend"
  subtitle: "Real results from explainable forecasting"
  metrics:
    - value: "95%"
      label: "Forecast Accuracy"
    - value: "4 Weeks"
      label: "Earlier Warning"
    - value: "80%"
      label: "Less Forecast Prep"
    - value: "100%"
      label: "Forecast Transparency"

features:
  title: "All Features That Enable Forecast Confidence"
  subtitle: "Beyond accurate predictions, AmolinoAI provides a complete toolkit to understand, defend, and improve your forecast accuracy over time"
  layout: "two-row-three-column"
  items:
    - name: "Pipeline Lens"
      category: "Intelligence"
      benefit: "Reality-based forecasts"
      description: "Identifies opportunities that need updating, closing, or removal from the pipeline so your forecast reflects reality, not wishful thinking."
      details: "Automatic pipeline hygiene • Deal aging analysis • Stale opportunity detection"
      icon: "🔍"
      image: "/screenshots/dashboard_revenue_forecast_april2025.jpg"
    - name: "Pipeline Monitor"
      category: "Monitoring"
      benefit: "Early risk detection"
      description: "Highlights deals at risk of slipping based on engagement drops, timeline changes, and competitive threats before they impact your number."
      details: "Risk alerts • Engagement tracking • Competitive monitoring • Timeline analysis"
      icon: "📊"
      image: "/screenshots/dashboard_pipeline_at_risk.jpg"
    - name: "Pushed Out History"
      category: "Analytics"
      benefit: "Learn from patterns"
      description: "Analyzes deals that get pushed out to identify common warning signs and trends, helping you spot similar patterns before they repeat."
      details: "Historical analysis • Pattern recognition • Trend identification • Predictive insights"
      icon: "📜"
      image: "/screenshots/pipeline_radar_pushed_opportunities_march2025.png"
    - name: "Team Intelligence Dashboard"
      category: "Visibility"
      benefit: "Complete team insight"
      description: "Shows each rep's pipeline health, win rates, and deal velocity in real time so you can forecast with complete visibility into team performance."
      details: "Rep performance • Win rate tracking • Deal velocity • Pipeline health"
      icon: "📈"
      image: "/screenshots/dashboard_revenue_forecast_april2025.jpg"
    - name: "Engagement Tracking"
      category: "Activity"
      benefit: "Engagement insights"
      description: "Tracks all sales activities and customer responses to show which deals have active engagement and which are going quiet—a leading indicator of forecast risk."
      details: "Activity tracking • Response monitoring • Engagement scoring • Silence detection"
      icon: "💬"
      image: "/screenshots/opportunities_health_risk.jpg"
    - name: "Deal Health (Risk Radar)"
      category: "Risk Management"
      benefit: "Proactive risk alerts"
      description: "Scores every opportunity based on engagement, stakeholder coverage, competitive position, and timeline to give you early warning of forecast risks."
      details: "Health scoring • Risk detection • Multi-signal analysis • Prioritized alerts"
      icon: "🎯"
      image: "/screenshots/opportunities_health_risk.jpg"

howItWorks:
  title: "How Explainable AI Forecasting Works"
  subtitle: "From black-box predictions to transparent, defendable forecasts"
  steps:
    - title: "AI Analyzes Every Signal"
      description: "AmolinoAI continuously monitors engagement patterns, timeline changes, stakeholder activity, and competitive signals across your entire pipeline. It identifies which deals are tracking to close and which show warning signs—giving you real-time visibility into forecast health."
      icon: "cloud"
    - title: "Generate Transparent Predictions"
      description: "Get quarterly revenue forecasts with 95%+ accuracy, backed by clear explanations. Every prediction shows the specific signals that drive it—engagement trends, stakeholder coverage, timeline momentum, and risk factors. No black box. Just data you can defend."
      icon: "lock"
    - title: "Defend with Confidence"
      description: "Walk into QBRs with forecasts you can actually explain. See best-case, likely, and worst-case scenarios. Identify at-risk deals weeks before they slip. Make data-driven decisions backed by the insights that matter."
      icon: "server"
  testimonial:
    quote: "AmolinoAI transformed our forecasting from guesswork to science. We now hit our number consistently and can defend every prediction with clear, explainable data."
    author: "Sarah Mitchell"
    role: "VP of Sales"
    avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80"

