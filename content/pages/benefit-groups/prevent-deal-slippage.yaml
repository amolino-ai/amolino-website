features:
  title: "All Features That Protect Your Revenue"
  subtitle: "Beyond risk detection, AmolinoAI provides a complete toolkit to understand deal health, prioritize interventions, and prevent slippage systematically"
  layout: "two-row-three-column"
  items:
    - name: "Engagement Tracking"
      category: "Activity"
      benefit: "Spot quiet deals early"
      description: "Tracks all sales activities and customer responses to show which deals have active engagement and which are going quiet—the first sign of slippage risk."
      details: "Activity monitoring • Response tracking • Engagement scoring • Silence alerts"
      icon: "💬"
      image: "/screenshots/opportunities_health_risk.jpg"
    - name: "Stakeholder Map"
      category: "Relationships"
      benefit: "Complete coverage insight"
      description: "Maps all contacts at an account with their roles, influence level, and engagement history to identify coverage gaps that put deals at risk."
      details: "Contact mapping • Influence scoring • Engagement history • Gap identification"
      icon: "👥"
      image: "/screenshots/opportunities_health_risk.jpg"
    - name: "Competitive Tracking"
      category: "Intelligence"
      benefit: "Early threat detection"
      description: "Tracks mentions of competitors in emails, calls, and notes across all opportunities to spot competitive threats before they derail your deals."
      details: "Competitor mentions • Threat alerts • Battle card suggestions • Win/loss analysis"
      icon: "🏁"
      image: "/screenshots/opportunities_health_risk.jpg"
    - name: "Next Steps Tracking"
      category: "Momentum"
      benefit: "Maintain deal velocity"
      description: "Automatically finds the next action reps committed to and flags opportunities where no next steps are defined—a critical slippage indicator."
      details: "Commitment tracking • Action identification • Missing step alerts • Follow-up reminders"
      icon: "➡️"
      image: "/screenshots/opportunities_health_risk.jpg"
    - name: "Pushed Out History"
      category: "Analytics"
      benefit: "Learn from patterns"
      description: "Analyzes deals that get pushed out to identify common warning signs, so you can recognize and address similar patterns before history repeats."
      details: "Historical analysis • Pattern recognition • Warning sign detection • Predictive insights"
      icon: "📜"
      image: "/screenshots/pipeline_radar_pushed_opportunities_march2025.png"
    - name: "Zero-effort CRM Updates"
      category: "Automation"
      benefit: "Always accurate data"
      description: "Automatically updates CRM from emails, calls, and meetings so you always have accurate data to assess deal health—no manual entry required."
      details: "Email sync • Call transcription • Meeting notes • Automatic field updates"
      icon: "🔄"
      image: "/screenshots/opportunities_health_risk.jpg"

howItWorks:
  title: "How Deal Protection Works"
  subtitle: "From reactive firefighting to proactive deal protection"
  steps:
    - title: "Continuous Multi-Signal Monitoring"
      description: "AmolinoAI monitors every opportunity across multiple dimensions—engagement patterns, stakeholder coverage, competitive threats, timeline momentum, and next step commitments. It detects warning signs the moment they appear, giving you weeks of advance notice before deals slip."
      icon: "cloud"
    - title: "Intelligent Risk Scoring & Prioritization"
      description: "Get real-time health scores on every deal based on comprehensive signal analysis. AmolinoAI automatically prioritizes at-risk opportunities by impact and urgency, so your team knows exactly which deals need attention first and why they're at risk."
      icon: "lock"
    - title: "Take Action Before It's Too Late"
      description: "Receive specific, actionable recommendations for each at-risk deal—who to engage, what objections to address, which stakeholders to involve. Save deals before they're lost. No more end-of-quarter surprises. Just proactive protection of your pipeline."
      icon: "server"
  testimonial:
    quote: "We used to lose deals we should have won because we spotted problems too late. With AmolinoAI, we see risks 3 weeks earlier and our win rates have increased by 25%."
    author: "Marcus Johnson"
    role: "CRO"
    avatar: "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?ixlib=rb-1.2.1&ixid=eyJhcHBfaWQiOjEyMDd9&auto=format&fit=facearea&facepad=2&w=256&h=256&q=80"

