hero:
  title: "Stop Deals from Slipping Before They Hit Your Forecast"
  subtitle: "AI-Powered Deal Protection"
  description: "The best way to hit your number is to never lose deals you should have won. AmolinoAI continuously monitors every opportunity for early warning signs—engagement drops, timeline shifts, stakeholder gaps, and competitive threats—giving your team time to course-correct before deals slip away. No more end-of-quarter surprises. Just proactive insights that keep your pipeline healthy and your forecast accurate."
  ctaText: "Try AmolinoAI"
  ctaLink: "https://app.amolino.ai"
  backgroundGradient: "from-red-600 to-orange-600"

problems:
  title: "Protect Your Pipeline Proactively"
  subtitle: "Stop losing winnable deals with proactive risk detection and intervention"
  cards:
    - icon: "🔔"
      title: "Early Warning System"
      description: "Get automatic alerts when deals show warning signs—before they fall off your forecast. See exactly what's changing and what to do about it. Spot risks weeks before deals slip."
    - icon: "📡"
      title: "Multi-Signal Risk Detection"
      description: "Track engagement patterns, stakeholder coverage, competitive activity, and timeline changes to identify at-risk deals with precision. Monitor every signal that matters."
    - icon: "🧭"
      title: "Actionable Recommendations"
      description: "Don't just see the problem—get specific recommendations on how to save at-risk deals before it's too late. Know exactly what to do next."

