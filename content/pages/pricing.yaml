testimonial:
  quote: "Thanks to AmolinoAI, we're finding new leads that we never would have found with legal methods."
  image: "/testimonials/tina-yards.jpg"
  authorRole: "Chief Revenue Office, Managing 50 people"

faqs:
  - question: "What's included in the free trial?"
    answer: "All customers get 21 days of free access to the Professional plan. This allows you to experience our complete suite of AI-powered sales tools, including guided selling, revenue analytics, and team insights."

  - question: "Can I upgrade or downgrade my plan later?"
    answer: "Yes, you can change your plan at any time. When upgrading, you'll be prorated for the remainder of your billing cycle. When downgrading, the change will take effect at the start of your next billing cycle."

  - question: "How quickly can I see results?"
    answer: "Most of our customers start seeing value withing the first days. After the initial integration with email you'll start seeing data in your AmolinoAI dashboard. Many of our customers report that they see data that they never knew existing because it was never collected and updated in the CRM before."

  - question: "What kind of support do you offer?"
    answer: "All plans include email support. Professional and Business plans include 24/7 call center support. Business plan customers also get a dedicated account manager for personalized assistance and strategic guidance."
