metadata:
  title: "Deal Prioritization | AI-Powered Sales Pipeline Management - AmolinoAI"
  description: "Focus your sales team on the right deals at the right time with AmolinoAI's Deal Prioritization. AI ranks opportunities by value, probability, urgency, and fit to maximize your revenue potential."
  image: "/screenshots/prevent-deal-slippage/deal-prioritization.png"
options:
  useCase: "Stop Chasing Un-Winnable Deals"
  featureName: "Deal Prioritization"
  showInNavbar: true
  navbarDescription: |
    AI ranks deals by value, probability, urgency, and fit to focus your team.
hero:
  badgeText: "Deal Prioritization"
  title: "Always work on the right deals at the right time."
  description: "AI automatically prioritizes your pipeline based on deal value, win probability, urgency, health, and strategic fit, ensuring you always focus your time and energy on the opportunities that matter most."
  ctaText: "Try AmolinoAI"
  ctaHref: "https://app.amolino.ai"
  screenshot:
    src: "/screenshots/prevent-deal-slippage/deal-prioritization.png"
    width: 1216
    height: 768
    fillContainer: true

