      solution: "40% fewer slipped deals"

whoItsFor:
  title: "Built For Teams Who Refuse to Lose Winnable Deals"
  subtitle: "This isn't for everyone. It's for teams who:"
  cards:
    - title: "Are Tired of End-of-Quarter Surprises"
      description: "You're done scrambling when deals slip at the last minute. You want early warning so you can take action before it's too late."
    - title: "Know They're Losing Deals They Should Win"
      description: "You have a gut feeling you're losing deals you could have saved if only you'd seen the warning signs earlier."
    - title: "Need Systematic Deal Protection"
      description: "You can't rely on rep intuition to spot at-risk deals. You need a systematic way to identify and prioritize interventions."
    - title: "Want Higher Win Rates"
      description: "You know the easiest way to hit your number is to stop losing deals. Every saved deal is pure incremental revenue."

