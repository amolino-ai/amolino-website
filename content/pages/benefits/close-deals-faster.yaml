metadata:
  title: "Prevent Deal Slippage | AI-Powered Deal Protection | Amolino"
  description: |
    Stop losing winnable deals with AI-powered deal protection. Get early warnings, multi-signal risk detection,
    and actionable recommendations to keep your pipeline healthy and your forecast accurate.
  image: "/screenshots/prevent-deal-slippage/deal-risk-radar-horizontal.png"

hero:
  badgeText: "Prevent Deal Slippage"
  title: "Stop Deals from Slipping Before They Hit Your Forecast"
  subtitle: "AI-Powered Deal Protection"
  description: |
    The best way to hit your number is to never lose deals you should have won. Amolino continuously monitors
    every opportunity for early warning signs (engagement drops, timeline shifts, stakeholder gaps, and competitive
    threats), giving your team time to course-correct before deals slip away. No more end-of-quarter surprises.
    Just proactive insights that keep your pipeline healthy and your forecast accurate.
  ctaText: "Book a Demo"
  ctaLink: "/demo"
  backgroundGradient: "from-red-600 to-orange-600"

featureHero:
  badgeText: "Proactive Deal Protection"
  heading: "Save Deals Before They Slip Away"
  description: |
    Designed to protect your pipeline and your forecast. Our AI continuously monitors every deal for risk signals
    (from engagement patterns to competitive threats), giving you the early warnings and actionable insights you
    need to intervene before it's too late.
  image:
    src: "/screenshots/prevent-deal-slippage/pushed_opportunities_on_dashboard.png"
    alt: "AI-powered deal risk radar showing health scores, early warning alerts, and recommended actions to prevent slippage"
    width: 3231
    height: 2127
  features:
    - name: "Early warning alerts"
      description: |
        Get notified the moment deals show warning signs (engagement drops, timeline pushes, or stakeholder gaps).
        Catch risks weeks before they impact your forecast.
    - name: "Multi-signal risk detection"
      description: |
        Monitor engagement, stakeholder coverage, competitive activity, and timeline changes to identify at-risk
        deals with precision.
    - name: "Actionable recommendations"
      description: |
        Don't just see the risk. Get specific, AI-powered recommendations on exactly what to do to save each
        at-risk deal.
    - name: "Continuous monitoring"
      description: |
        24/7 deal health tracking ensures nothing slips through the cracks. Your AI safety net that never sleeps.

problems:
  title: "Protect Your Pipeline Proactively"
  subtitle: "Stop losing winnable deals with proactive risk detection and intervention"
  cards:
    - icon: "🔔"
      title: "Early Warning System"
      description: |
        Get automatic alerts when deals show warning signs before they fall off your forecast. See exactly
        what's changing and what to do about it. Spot risks weeks before deals slip.
    - icon: "📡"
      title: "Multi-Signal Risk Detection"
      description: |
        Track engagement patterns, stakeholder coverage, competitive activity, and timeline changes to identify
        at-risk deals with precision. Monitor every signal that matters.
    - icon: "🧭"
      title: "Actionable Recommendations"
      description: |
        Don't just see the problem. Get specific recommendations on how to save at-risk deals before it's too late.
        Know exactly what to do next.

