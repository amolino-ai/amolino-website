hero:
  title: "Make Every Rep Your Best Rep"
  subtitle: "Clone your top performers' playbook with AI"
  description: "Your A-players know exactly what to do in every deal situation. Now your entire team can execute with the same precision, consistency, and insight—automatically guided by what actually works."
  ctaText: "See How It Works"
