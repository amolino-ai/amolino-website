problems:
  title: "Make Every Rep Your Best Rep"
  subtitle: "Clone your top performers' playbook with AI"
  cards:
    - icon: "🎯"
      title: "Your Top 20% Know the Playbook"
      description: "They update CRM religiously. They qualify ruthlessly. They engage every stakeholder. They sense when deals are slipping and act immediately. They know which actions to take at each deal stage."
    - icon: "🤷"
      title: "Your Middle 60% Wing It"
      description: "They forget to update CRM. They chase unqualified deals. They miss key stakeholders. They let deals go quiet without noticing. They don't know what good looks like at each stage."
    - icon: "💰"
      title: "The Cost: Millions in Lost Revenue"
      description: "If your middle performers executed like your top performers, your team would close 30-50% more revenue—with the same headcount, same product, same leads."

