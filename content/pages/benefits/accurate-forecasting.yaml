metadata:
  title: "Forecast with Confidence | AI-Powered Revenue Forecasting - AmolinoAI"
  description: "Get 95%+ accurate revenue forecasts with explainable AI. Track every signal, predict outcomes, and defend your numbers with confidence. Transform forecasting from guesswork to certainty."
  image: "/screenshots/accurate-forecasting/dashboard-revenue_analysis-forecast-widget.png"

hero:
  badgeText: "Forecast Confidently"
  title: "Defend Every Forecast with Confidence"
  subtitle: "AI-Powered Revenue Forecasting"
  description: |
    Defend your forecast with confidence. Amolino uses AI totracks hundreds of pipeline
    signals to predict revenue with 95% accuracy—showing the engagement patterns,
    stakeholder signals, and timeline shifts behind every prediction.
  ctaText: "Try AmolinoAI"
  ctaLink: "https://app.amolino.ai"
  backgroundGradient: "from-blue-600 to-cyan-600"

featureHero:
  badgeText: "Explainable AI Forecasting"
  heading: "Forecasts You Can Trust and Explain"
  description: |
    Defend your forecast with confidence. Amolino uses AI totracks hundreds of pipeline
    signals to predict revenue with 95% accuracy—showing the engagement patterns,
    stakeholder signals, and timeline shifts behind every prediction.
  image:
    src: "/screenshots/accurate-forecasting/dashboard-revenue_analysis-forecast-widget.png"
    alt: "AI-powered revenue forecasting dashboard showing explainable predictions with signal analysis and scenario planning"
    width: 3231
    height: 1770
  features:
    - name: "Understand, explain, and defend"
      description: |
        Get accurate quarterly revenue forecasts that actually make sense.
        Every prediction is backed by clear explanations of the signals that drive it. No black boxes.
    - name: "Deal-level predictions"
      description: |
        Amolino provides a quarterly forecast and breaks it down by
        individual deals—so you can see exactly which deals are
        likely to close and which are at risk. 
    - name: "Scenario Planning"
      description: |
        View best-case, worst-case, and most-likely revenue scenarios, to plan with
        confidence and set realistic expectations.
    - name: "Real-time updates"
      description: |
        Forecasts update automatically as deals progress. They always include
        the latest signals and insights without you having to run reports in
        SalesForce or HubSpot or munge spreadsheets.

problems:
  title: "Forecast with Transparency, Not Hope"
  subtitle: "Transform unreliable forecasts into defendable predictions with explainable AI"
  cards:
    - icon: "🎯"
      title: "AI-Powered Precision"
      description: "Get quarterly forecasts that show exactly why each deal is likely to close—or slip. Every prediction comes with the signals that drive it. Predictions you can trust and explain."
    - icon: "⚡"
      title: "Signal-Based Intelligence"
      description: "Track engagement drops, timeline shifts, and stakeholder changes that impact your forecast—before they surprise you in the QBR. Real-time visibility into what's changing."
    - icon: "🔀"
      title: "Scenario Planning"
      description: "See your ceiling, floor, and most probable revenue scenarios so you can make informed decisions and set realistic expectations. Plan for best, worst, and likely outcomes."

