    - capability: "Signal-based insights"
      traditional: "Limited visibility"
      solution: "✓ Every signal tracked"
    - capability: "Forecast prep time"
      traditional: "Days of work"
      solution: "Minutes with AI"

whoItsFor:
  title: "Built For Sales Leaders Who Need Forecast Certainty"
  subtitle: "This isn't for everyone. It's for leaders who:"
  cards:
    - title: "Need to Defend Their Forecasts"
      description: "You're tired of walking into QBRs with gut-feel predictions. You want forecasts backed by clear, explainable data you can defend with confidence."
    - title: "Want to Hit Their Number Consistently"
      description: "You know accurate forecasting is the foundation of predictable revenue. You need precision, not guesswork."
    - title: "Value Transparency Over Mystery"
      description: "You don't trust black-box predictions. You want to see exactly what signals drive your forecast and why deals are likely to close—or slip."
    - title: "Need Early Warning of Risks"
      description: "You're done being surprised by deals that slip. You want to spot forecast risks weeks before they impact your quarter."
