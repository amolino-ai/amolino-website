howItWorks:
  title: "How Explainable AI Forecasting Works"
  subtitle: "From black-box predictions to transparent, defendable forecasts"
  steps:
    - title: "AI Analyzes Every Signal"
      description: "AmolinoAI continuously monitors engagement patterns, timeline changes, stakeholder activity, and competitive signals across your entire pipeline. It identifies which deals are tracking to close and which show warning signs—giving you real-time visibility into forecast health."
      icon: "cloud"
    - title: "Generate Transparent Predictions"
      description: "Get quarterly revenue forecasts with 95%+ accuracy, backed by clear explanations. Every prediction shows the specific signals that drive it—engagement trends, stakeholder coverage, timeline momentum, and risk factors. No black box. Just data you can defend."
      icon: "lock"
    - title: "Defend with Confidence"
      description: "Walk into QBRs with forecasts you can actually explain. See best-case, likely, and worst-case scenarios. Identify at-risk deals weeks before they slip. Make data-driven decisions backed by the insights that matter."
      icon: "server"
  testimonial:
    quote: "This product has been really useful in giving sales teams clarity on their pipeline and how they're going to hit their numbers."
    author: "Brian Sathianathan"
    role: "COO at Iterate.ai"
    avatar: "/people/Brian_Sathianathan.png"
comparison:
  title: "Traditional Forecasting vs. Explainable AI"
  columns:
