howItWorks:
  title: "How It Actually Works"
  subtitle: "From tribal knowledge to systematic execution in three steps"
  steps:
    - title: "AI Learns Your Top Performers' Playbook"
      description: "We analyze closed-won deals from your best reps to identify the specific actions, timing, and patterns that lead to success. What qualification questions do they ask? When do they engage executives? How do they handle objections? The AI extracts these winning behaviors automatically."
      icon: "cloud"
    - title: "Real-Time Guidance for Every Rep"
      description: "As reps work their deals, they get proactive recommendations based on the winning playbook. 'Your top performers engage IT stakeholders at this stage.' 'Similar deals that closed had executive alignment by now.' 'This competitor was mentioned—here's how we've won against them.' The guidance is contextual, timely, and specific."
      icon: "lock"
    - title: "Automatic Execution & Tracking"
      description: "All the manual work disappears. CRM updates itself from emails and calls. Qualification criteria fill in automatically. Deal health gets scored continuously. Next steps get tracked and flagged. Reps spend 100% of their time actually selling—not on admin work."
      icon: "server"
  testimonial:
    quote: "This product has been really useful in giving sales teams clarity on their pipeline and how they're going to hit their numbers."
    author: "Brian Sathianathan"
    role: "COO at Iterate.ai"
    avatar: "/people/Brian_Sathianathan.png"

