whoItsFor:
  title: "Built For Sales Leaders Who Want Predictability"
  subtitle: "This isn't for everyone. It's for leaders who:"
  cards:
    - title: "Have A-Players Worth Cloning"
      description: "You have top performers whose approach you'd love to bottle and distribute. You know what good looks like—you just can't scale it."
    - title: "Are Tired of CRM Theater"
      description: "You're sick of begging reps to update Salesforce. You want the data without the burden."
    - title: "Need Consistent Execution"
      description: "Your deals are too complex for reps to freestyle. You need a repeatable process that actually gets followed."
    - title: "Want to Coach, Not Police"
      description: "You'd rather spend time developing talent than chasing forecast updates and deal hygiene."
