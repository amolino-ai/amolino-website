introText: "Turning a QBR into a competitive weapon with proven best practices."

bestPractices:
  - pillar: "1. Data-Driven Storytelling"
    whatGreatLooksLike: "Narrative links cause → effect → decision in ≤ 15 slides."
    quickTactics: "• Start with the \"movie trailer\" slide (goals vs. reality).\n• Use 4-quarter rolling charts—avoid single-point snapshots."

  - pillar: "2. Customer-Centric Lens"
    whatGreatLooksLike: "Success and failure are framed in terms of customer impact, not just internal targets."
    quickTactics: "• Every metric answer the question: \"How does this help or hurt the customer?\"\n• Include a short audio or video clip from a recent customer interview."

  - pillar: "3. Action Orientation"
    whatGreatLooksLike: "No slide is discussion-only; each one finishes with a next step."
    quickTactics: "• \"Decision / Owner / Date\" footer on every slide.\n• Live Asana board projected during the meeting."

  - pillar: "4. Cross-Functional Alignment"
    whatGreatLooksLike: "Sales, CS, Marketing, Product speak from one source of truth and share dependencies."
    quickTactics: "• Pre-QBR huddle with function heads to resolve data disputes.\n• RAG-status matrix (rows = teams, cols = shared projects)."

  - pillar: "5. Rigor & Accountability"
    whatGreatLooksLike: "Commitments carry real weight and are inspected weekly."
    quickTactics: "• Friday Slack digest auto-pulls status from Asana.\n• CRO opens the next QBR by grading last quarter's action completion %."

  - pillar: "6. High Engagement"
    whatGreatLooksLike: "Attendees ask questions, debate trade-offs, and stay off email."
    quickTactics: "• Ice-breaker \"prediction poll\" at the start (e.g., \"Where will we land NRR?\").\n• Rotate section presenters—don't let one exec monologue all 3 h."

  - pillar: "7. Respect for Time"
    whatGreatLooksLike: "Meeting starts/ends on schedule; discussions that exceed timebox go to a spin-off."
    quickTactics: "• Visible countdown timer.\n• \"Parking Lot\" slide for tangents; assign owner to follow up offline."

croSection:
  heading: "Extra Guidance for CROs"
  imperatives:
    - imperative: "Craft a Data-backed Narrative"
      howToNail: "Use the ARC arc: Answer the board's top question → Reveal supporting data → Call for decision."

    - imperative: "Own the Good and the Bad"
      howToNail: "Display miss metrics side-by-side with corrective plan; positions you as a problem-solver, not excuse-maker."

    - imperative: "Tie Metrics to Money"
      howToNail: "Translate every KPI into revenue impact (e.g., \"1-point NRR lift = +$250 k ARR next quarter\")."

    - imperative: "Keep the Room Focused"
      howToNail: "Pre-wire any controversial topics with individual execs so the live debate is constructive, not chaotic."

    - imperative: "Close with Clarity"
      howToNail: "Verbally restate the three most critical actions, name the owners, and confirm deadlines before anyone leaves."

closingText: "Embed these practices and the QBR ceases to be \"just another meeting.\" It becomes the operating rhythm that aligns strategy, exposes risk early, and powers continuous revenue growth."
